services:
  frontend:
    build: requirements/frontend
    image: frontend:ft
    container_name: frontend
    volumes:
      - ./requirements/frontend/srcs:/usr/share/nginx/html
      - ./requirements/frontend/conf/nginx.conf:/etc/nginx/conf.d/default.conf
      - profile:/usr/share/nginx/media/profile_images
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - ft

  backend:
    build: requirements/backend
    image: backend:ft
    container_name: backend
    init: true
    depends_on:
      - db
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DATABASE_URL: ${DJANGO_URL}
    volumes:
      - profile:/app/media/profile_images
    networks:
      - ft

  db:
    image: postgres:17-alpine
    container_name: db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - ft

networks:
  ft:
    driver: bridge

volumes:
  profile:
    name: profile
    driver: local
    driver_opts:
      type: none
      device: ${PWD}/media/profile_images/
      o: bind
