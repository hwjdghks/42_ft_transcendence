<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Authentication</title>
</head>

<body>
    <div id="authSection">
        <h2>Sign Up</h2>
        <form id="signupForm">
            <input type="email" id="signupEmail" placeholder="Email" required />
            <input type="text" id="signupUsername" placeholder="Username" required />
            <input type="password" id="signupPassword" placeholder="Password" required />
            <button type="submit">Sign Up</button>
        </form>

        <h2>Login</h2>
        <form id="loginForm">
            <input type="email" id="loginEmail" placeholder="Email" required />
            <input type="password" id="loginPassword" placeholder="Password" required />
            <button type="submit">Login</button>
        </form>
    </div>

    <div id="userSection" style="display:none;">
        <h2>User Profile</h2>
        <button id="viewProfileBtn">View Profile</button>
        <div id="profileDetails" style="display:none;">
            <p>Email: <span id="userEmail"></span></p>
            <p>Username: <span id="userUsername"></span></p>
            <img id="userProfileImage" src="" alt="Profile Image" style="display:none;" />
            <button id="uploadProfileImageBtn">Upload Profile Image</button>
        </div>
        <button id="logoutBtn">Log Out</button>
        <button id="withdrawBtn">Withdraw</button>
    </div>

    <script src="script.js"></script>
</body>

</html>
